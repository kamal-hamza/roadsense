name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# mise installs the pinned tools (incl. just); jobs run the same just recipes used locally.
# `xcode-27` is GitHub's Apple Silicon runner image with the Xcode 27 toolchain.

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: just lint

  build:
    name: Build (Release)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      CONFIGURATION: Release
      DESTINATION: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: xcodebuild -version
      - run: just build

  test:
    name: Test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Pick an available iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                     | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::No iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid"
          echo "DESTINATION=id=$udid" >> "$GITHUB_ENV"
      - run: just test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
